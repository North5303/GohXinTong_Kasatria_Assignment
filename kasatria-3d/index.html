<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasatria - 3D Interactive Periodic Table</title>

    <!-- External Libraries: Google Auth, CSV Parser, Three.js 3D Engine, Tween Animations -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #020509;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ------------------------------------------- */
        /* 1. LOGIN SCREEN STYLES (Matches Image A)    */
        /* ------------------------------------------- */
        #login-view {
            position: absolute;
            inset: 0;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: #ffffff;
            padding: 48px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 380px;
        }

        .login-box h2 {
            font-size: 24px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 8px;
        }

        .login-box p {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        #google-btn-container {
            display: flex;
            justify-content: center;
        }

        /* ------------------------------------------- */
        /* 2. 3D VISUALIZATION VIEW                    */
        /* ------------------------------------------- */
        #app-view {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Bottom Format Switching Buttons */
        #menu {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        button.nav-btn {
            background: rgba(0, 127, 127, 0.35);
            border: 1px solid rgba(127, 255, 255, 0.7);
            color: rgba(127, 255, 255, 0.9);
            padding: 9px 20px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.nav-btn:hover,
        button.nav-btn.active {
            background: rgba(0, 255, 255, 0.75);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
        }

        /* Net Worth Legend (Matches Image B) */
        #legend-box {
            position: absolute;
            bottom: 25px;
            right: 35px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 14px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-weight: 600;
        }

        .legend-gradient {
            width: 110px;
            height: 10px;
            border-radius: 2px;
            background: linear-gradient(to right, #EF5022, #FFA500, #3A9F4B);
        }

        /* ------------------------------------------- */
        /* 3. CARD STYLING (Matches Image B structure) */
        /* ------------------------------------------- */
        .element-card {
            width: 130px;
            height: 175px;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .element-card:hover {
            border-color: #fff;
            transform: scale(1.05);
        }

        .card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-avatar {
            width: 75px;
            height: 75px;
            border-radius: 4px;
            object-fit: cover;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 6px;
        }

        .card-name {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-role {
            font-size: 9px;
            text-align: center;
            opacity: 0.8;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Requirement 5: Color based on Net Worth */
        .bg-red {
            background-color: rgba(239, 80, 34, 0.8) !important;
            border-color: #EF5022;
        }

        .bg-orange {
            background-color: rgba(255, 165, 0, 0.8) !important;
            border-color: #FFA500;
        }

        .bg-green {
            background-color: rgba(58, 159, 75, 0.8) !important;
            border-color: #3A9F4B;
        }
    </style>
</head>

<body>

    <!-- Screen 1: Google Login Screen (Image A) -->
    <div id="login-view">
        <div class="login-box">
            <h2>Welcome Back</h2>
            <p>Please authenticate with your Google account to view the dataset.</p>
            <div id="google-btn-container"></div>
        </div>
    </div>

    <!-- Screen 2: 3D Visualization Screen (Image B & C) -->
    <div id="app-view">
        <div id="canvas-container"></div>

        <div id="menu">
            <button id="btn-table" class="nav-btn active">Table</button>
            <button id="btn-sphere" class="nav-btn">Sphere</button>
            <button id="btn-helix" class="nav-btn">Helix</button>
            <button id="btn-grid" class="nav-btn">Grid</button>
        </div>

        <div id="legend-box">
            <span style="color: #EF5022;">LOW (&lt;$100K)</span>
            <div class="legend-gradient"></div>
            <span style="color: #3A9F4B;">HIGH (&gt;$200K)</span>
        </div>
    </div>

    <script>
        // ==========================================
        // STEP A: CONFIGURE CREDENTIALS
        // ==========================================
        // 1. Paste your Google Client ID here:
        const GOOGLE_CLIENT_ID = "PASTE_YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com";

        // 2. Paste your Published Google Sheet CSV URL here:
        const SHEET_CSV_URL = "PASTE_YOUR_PUBLISHED_GOOGLE_SHEET_CSV_URL_HERE";

        // ==========================================
        // STEP B: GOOGLE SIGN-IN HANDLER
        // ==========================================
        window.onload = function () {
            if (window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: onGoogleLoginSuccess
                });

                google.accounts.id.renderButton(
                    document.getElementById("google-btn-container"),
                    {theme: "outline", size: "large", width: 250}
                );
            }
        };

        function onGoogleLoginSuccess(response) {
            if (response && response.credential) {
                // Hide Login Screen and Reveal 3D Canvas
                document.getElementById("login-view").style.display = "none";
                document.getElementById("app-view").style.display = "block";
                // Fetch Sheet Data
                fetchData();
            }
        }

        // ==========================================
        // STEP C: LOAD CSV DATA FROM GOOGLE SHEET
        // ==========================================
        function fetchData() {
            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function (results) {
                    if (results.data && results.data.length > 0) {
                        start3DVisualization(results.data);
                    } else {
                        fallbackData();
                    }
                },
                error: function (err) {
                    console.warn("Could not load CSV online, using backup test data.", err);
                    fallbackData();
                }
            });
        }

        function fallbackData() {
            // 200 items fallback so table/grid layouts fill completely
            const backup = [];
            for (let i = 1; i <= 200; i++) {
                backup.push({
                    id: i,
                    name: "Sample Person " + i,
                    title: "Staff Member",
                    netWorth: Math.floor(Math.random() * 250000) + 40000,
                    image: `https://i.pravatar.cc/150?img=${(i % 70) + 1}`
                });
            }
            start3DVisualization(backup);
        }

        // ==========================================
        // STEP D: THREE.JS 3D ENGINE IMPLEMENTATION
        // ==========================================
        let camera, scene, renderer, controls;
        const objects = [];
        const targets = {table: [], sphere: [], helix: [], grid: []};

        function start3DVisualization(rawData) {
            // Ensure exactly 200 elements for 20x10 and 5x4x10 requirements
            const items = rawData.slice(0, 200);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 2600;

            scene = new THREE.Scene();

            // Loop through data and build CSS 3D elements (Image B)
            for (let i = 0; i < items.length; i++) {
                const item = items[i];

                // Parse net worth number (handles "$120,000" or raw 120000)
                let worthStr = String(item.netWorth || item.NetWorth || item["Net Worth"] || 0);
                let worth = Number(worthStr.replace(/[^0-9.-]+/g, "")) || 0;

                const card = document.createElement("div");
                card.className = "element-card";

                // Requirement 5: Color based on Net Worth
                if (worth < 100000) {
                    card.classList.add("bg-red");
                } else if (worth <= 200000) {
                    card.classList.add("bg-orange");
                } else {
                    card.classList.add("bg-green");
                }

                // Header: ID and formatted Net Worth
                const top = document.createElement("div");
                top.className = "card-header";
                top.innerHTML = `<span>#${i + 1}</span><span>$${Math.round(worth / 1000)}K</span>`;
                card.appendChild(top);

                // Avatar Image
                const img = document.createElement("img");
                img.className = "card-avatar";
                img.src = item.image || item.Image || item.avatar || `https://i.pravatar.cc/150?img=${(i % 70) + 1}`;
                card.appendChild(img);

                // Name
                const name = document.createElement("div");
                name.className = "card-name";
                name.textContent = item.name || item.Name || `Person ${i + 1}`;
                card.appendChild(name);

                // Subtitle / Department / Role
                const role = document.createElement("div");
                role.className = "card-role";
                role.textContent = item.department || item.Department || item.role || item.Role || "Kasatria";
                card.appendChild(role);

                // Wrap into CSS3DObject
                const objectCSS = new THREE.CSS3DObject(card);
                // Start from random scattered points in space
                objectCSS.position.x = Math.random() * 4000 - 2000;
                objectCSS.position.y = Math.random() * 4000 - 2000;
                objectCSS.position.z = Math.random() * 4000 - 2000;
                scene.add(objectCSS);
                objects.push(objectCSS);
            }

            // ----------------------------------------------------
            // FORMAT 1: TABLE (20x10) - Requirement 7 & Image B
            // ----------------------------------------------------
            const cols = 20;
            const rows = 10;
            const stepX = 145;
            const stepY = 190;

            for (let i = 0; i < objects.length; i++) {
                const c = i % cols;
                const r = Math.floor(i / cols);

                const target = new THREE.Object3D();
                target.position.x = (c * stepX) - ((cols * stepX) / 2) + (stepX / 2);
                target.position.y = -(r * stepY) + ((rows * stepY) / 2) - (stepY / 2);
                target.position.z = 0;
                targets.table.push(target);
            }

            // ----------------------------------------------------
            // FORMAT 2: SPHERE
            // ----------------------------------------------------
            const vector = new THREE.Vector3();
            for (let i = 0, l = objects.length; i < l; i++) {
                const phi = Math.acos(-1 + (2 * i) / l);
                const theta = Math.sqrt(l * Math.PI) * phi;

                const target = new THREE.Object3D();
                target.position.setFromSphericalCoords(850, phi, theta);

                vector.copy(target.position).multiplyScalar(2);
                target.lookAt(vector);
                targets.sphere.push(target);
            }

            // ----------------------------------------------------
            // FORMAT 3: DOUBLE HELIX - Requirement 8
            // ----------------------------------------------------
            const helixRadius = 850;
            for (let i = 0; i < objects.length; i++) {
                const strand = i % 2; // Strand 0 or Strand 1
                const indexInStrand = Math.floor(i / 2);

                // 180 degrees (Math.PI) offset separates the two intertwined strands
                const theta = indexInStrand * 0.175 + (strand === 1 ? Math.PI : 0);
                const y = -(indexInStrand * 15) + 700;

                const target = new THREE.Object3D();
                target.position.x = helixRadius * Math.sin(theta);
                target.position.y = y;
                target.position.z = helixRadius * Math.cos(theta);

                vector.x = target.position.x * 2;
                vector.y = target.position.y;
                vector.z = target.position.z * 2;
                target.lookAt(vector);

                targets.helix.push(target);
            }

            // ----------------------------------------------------
            // FORMAT 4: GRID (5x4x10) - Requirement 9 & Image C
            // Width = 10, Height = 4, Depth = 5 (10 * 4 * 5 = 200)
            // ----------------------------------------------------
            const gridCols = 10;
            const gridRows = 4;
            const gridLayers = 5;

            const spacingX = 220;
            const spacingY = 250;
            const spacingZ = 380;

            for (let i = 0; i < objects.length; i++) {
                const xIndex = i % gridCols;
                const yIndex = Math.floor(i / gridCols) % gridRows;
                const zIndex = Math.floor(i / (gridCols * gridRows));

                const target = new THREE.Object3D();
                target.position.x = (xIndex * spacingX) - ((gridCols * spacingX) / 2) + (spacingX / 2);
                target.position.y = -(yIndex * spacingY) + ((gridRows * spacingY) / 2) - (spacingY / 2);
                target.position.z = (zIndex * spacingZ) - ((gridLayers * spacingZ) / 2);

                targets.grid.push(target);
            }

            // Renderer Setup
            renderer = new THREE.CSS3DRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById("canvas-container").appendChild(renderer.domElement);

            // Mouse Drag Controls
            controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.minDistance = 400;
            controls.maxDistance = 6000;
            controls.addEventListener("change", render);

            // Connect Button Clicks to Layout Transitions
            bindButton("btn-table", targets.table);
            bindButton("btn-sphere", targets.sphere);
            bindButton("btn-helix", targets.helix);
            bindButton("btn-grid", targets.grid);

            // Smoothly animate into the default Table formation
            transform(targets.table, 2000);

            window.addEventListener("resize", onWindowResize);
            animate();
        }

        function bindButton(btnId, targetFormation) {
            const btn = document.getElementById(btnId);
            btn.addEventListener("click", () => {
                document.querySelectorAll("button.nav-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                transform(targetFormation, 1800);
            });
        }

        function transform(targetList, duration) {
            TWEEN.removeAll();

            for (let i = 0; i < objects.length; i++) {
                const object = objects[i];
                const target = targetList[i];

                // Animate Position
                new TWEEN.Tween(object.position)
                    .to({x: target.position.x, y: target.position.y, z: target.position.z}, Math.random() * duration + duration)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();

                // Animate Rotation
                new TWEEN.Tween(object.rotation)
                    .to({x: target.rotation.x, y: target.rotation.y, z: target.rotation.z}, Math.random() * duration + duration)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();
            }

            new TWEEN.Tween(this)
                .to({}, duration * 2)
                .onUpdate(render)
                .start();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            render();
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
        }

        function render() {
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
